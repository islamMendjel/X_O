<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Neo Tic-Tac-Toe</title>
  <style>
    /* Import a futuristic font */
    @import url('https://fonts.googleapis.com/css2?family=Oxanium:wght@300;600&display=swap');

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      font-family: 'Oxanium', cursive;
      color: #e0e0e0;
    }

    .game-wrapper {
      backdrop-filter: blur(10px);
      background: rgba(255,255,255,0.05);
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      padding: 2rem;
      max-width: 360px;
      width: 90%;
      text-align: center;
    }

    h1 {
      margin-bottom: 0.5rem;
      font-size: 1.8rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      text-shadow: 0 0 8px rgba(0, 255, 255, 0.7);
    }

    .scoreboard {
      display: flex;
      justify-content: space-around;
      margin-bottom: 1rem;
      font-size: 1rem;
    }

    .score {
      background: rgba(255,255,255,0.1);
      padding: 0.5rem 1rem;
      border-radius: 8px;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
    }

    .cell {
      background: rgba(255,255,255,0.1);
      border: 2px solid rgba(0,255,255,0.4);
      border-radius: 8px;
      width: 100%;
      padding-top: 100%; /* 1:1 aspect ratio */
      position: relative;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .cell:hover {
      transform: translateY(-4px);
      box-shadow: 0 4px 20px rgba(0,255,255,0.6);
    }
    .cell:active {
      transform: translateY(0);
      box-shadow: 0 2px 10px rgba(0,255,255,0.8);
    }

    .cell span {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2.5rem;
      pointer-events: none;
      text-shadow: 0 0 8px rgba(0,255,255,0.8);
    }

    .controls {
      margin-top: 1rem;
    }
    .btn {
      background: rgba(0,255,255,0.2);
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      font-size: 1rem;
      color: #e0e0e0;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    .btn:hover {
      background: rgba(0,255,255,0.4);
    }
  </style>
</head>
<body>

  <div class="game-wrapper">
    <h1>Neo Tic-Tac-Toe</h1>
    <div class="scoreboard">
      <div class="score">X: <span id="scoreX">0</span></div>
      <div class="score">O: <span id="scoreO">0</span></div>
    </div>
    <div class="board" id="board">
      <!-- 9 cells auto-generated by JS -->
    </div>
    <div class="controls">
      <button class="btn" id="restartBtn">Restart Game</button>
    </div>
  </div>

  <script>
    const Game = (() => {
      const boardEl = document.getElementById('board');
      const scoreXEl = document.getElementById('scoreX');
      const scoreOEl = document.getElementById('scoreO');
      const restartBtn = document.getElementById('restartBtn');

      let currentPlayer = 'X';
      let board = Array(9).fill('');
      let scores = { X: 0, O: 0 };

      const winPatterns = [
        [0,1,2],[3,4,5],[6,7,8],
        [0,3,6],[1,4,7],[2,5,8],
        [0,4,8],[2,4,6]
      ];

      function init() {
        boardEl.innerHTML = '';
        board.forEach((_, idx) => {
          const cell = document.createElement('div');
          cell.classList.add('cell');
          cell.addEventListener('click', () => handleMove(idx, cell));
          const span = document.createElement('span');
          cell.appendChild(span);
          boardEl.appendChild(cell);
        });
        updateScores();
      }

      function handleMove(idx, cellEl) {
        if (board[idx] !== '') return;
        board[idx] = currentPlayer;
        cellEl.querySelector('span').textContent = currentPlayer;
        if (checkWin()) {
          alert(`${currentPlayer} wins!`);
          scores[currentPlayer]++;
          updateScores();
          resetBoard();
        } else if (board.every(c => c !== '')) {
          alert("It's a tie!");
          resetBoard();
        } else {
          currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
        }
      }

      function checkWin() {
        return winPatterns.some(pattern =>
          pattern.every(i => board[i] === currentPlayer)
        );
      }

      function resetBoard() {
        board.fill('');
        document.querySelectorAll('.cell span').forEach(s => s.textContent = '');
        currentPlayer = 'X';
      }

      function updateScores() {
        scoreXEl.textContent = scores.X;
        scoreOEl.textContent = scores.O;
      }

      restartBtn.addEventListener('click', () => {
        scores = { X: 0, O: 0 };
        updateScores();
        resetBoard();
      });

      return { init };
    })();

    window.onload = Game.init;
  </script>

</body>
</html>
